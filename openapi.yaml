openapi: 3.0.3
info:
  title: tutalink API
  version: 1.0.0
  description: Link shortener microservice for TutaMall marketing
servers:
  - url: http://localhost:4100
paths:
  /tutalink/api/links:
    post:
      summary: Create a short link
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                customCode: { type: string }
                expiresAt: { type: string, format: date-time }
      responses:
        '201': { description: Created }
        '409': { description: Custom code taken }
    get:
      summary: List links (paginated)
      security: [{ ApiKey: [] }]
      responses:
        '200': { description: OK }
  /tutalink/api/links/{code}:
    get:
      summary: Link details
      security: [{ ApiKey: [] }]
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Not found }
    patch:
      summary: Update link
      security: [{ ApiKey: [] }]
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
    delete:
      summary: Delete link
      security: [{ ApiKey: [] }]
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
  /tutalink/api/links/{code}/stats:
    get:
      summary: Click stats
      security: [{ ApiKey: [] }]
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
  /l/{code}:
    get:
      summary: Public redirect
      parameters:
        - in: path
          name: code
          required: true
          schema: { type: string }
      responses:
        '302': { description: Redirect }
        '404': { description: Unknown }
        '410': { description: Expired or inactive }
  /tutalink/actuator/health:
    get:
      summary: Health (DB + Redis)
      responses:
        '200': { description: UP }
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
